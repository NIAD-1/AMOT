[build]
  command = "cd apps/web && npx vite build"
  publish = "apps/web/dist"

[[redirects]]
  from = "/api/*"
  to = "https://amot-274f.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/health"
  to = "https://amot-274f.onrender.com/health"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"
